[project]
name = "dispatch-tower"
version = "0.1.0"
description = "Dispatch Control Tower: full-scope reference Databricks App (demo2)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.119.0",
    "pydantic-settings>=2.11.0",
    "uvicorn>=0.37.0",
    "databricks-sdk>=0.81.0",
    "psycopg[binary,pool]>=3.2.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
    "httpx>=0.28.0",
]

[tool.apx.metadata]
app-name = "dispatch-tower"
app-slug = "dispatch_tower"
app-entrypoint = "dispatch_tower.app:app"
api-prefix = "/api"

[tool.apx.ui]
root = "ui"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/dispatch_tower"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["ui"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
